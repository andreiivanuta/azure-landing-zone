# Automated, READ-ONLY Terraform preview for workload changes proposed in a pull request into main.
# Runs as the low-trust PR identity (OIDC subject :pull_request) - it can make NO changes (no lock, read-only RBAC).
#   added/changed vending/workloads/<name>.tfvars -> `terraform plan`          (create/update preview)
#   deleted       vending/workloads/<name>.tfvars -> `terraform plan -destroy` (offboard preview)
# Each preview is posted back to the PR as a comment for review (the gate). On merge, vending-apply /
# vending-destroy RE-PLAN against current state and apply - so a re-run is always safe. This workflow only
# previews; it uploads no plan artifact.
# NOTE: pin actions to commit SHAs before treating any workflow as production.
name: Vending PR plan

on:
  pull_request:
    branches: [main]
    paths:
      - "vending/**"
      - "modules/workload-identity/**"
      - "config/project.json"
      - ".github/workflows/vending-pr-plan.yml"

permissions:
  id-token: write # mint the GitHub OIDC token for Azure login
  contents: read # checkout
  pull-requests: write # post the preview as a PR comment

concurrency:
  group: vending-pr-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # 1) Classify changed intake files: added/changed -> plan, deleted -> destroy.
  detect:
    runs-on: ubuntu-latest
    outputs:
      plan_workloads: ${{ steps.diff.outputs.plan_workloads }}
      destroy_workloads: ${{ steps.diff.outputs.destroy_workloads }}
      any_plan: ${{ steps.diff.outputs.any_plan }}
      any_destroy: ${{ steps.diff.outputs.any_destroy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need base + head to diff

      - id: diff
        name: Detect changed workloads
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          names() { grep -v '\.example$' | sed -n 's#.*/\([^/]*\)\.tfvars#\1#p' | sort -u; }
          added=$(git diff --name-only --diff-filter=ACMR "$base" "$head" -- 'vending/workloads/*.tfvars' | names)
          deleted=$(git diff --name-only --diff-filter=D "$base" "$head" -- 'vending/workloads/*.tfvars' | names)
          to_json() { if [ -n "$1" ]; then printf '%s\n' "$1" | jq -R . | jq -cs .; else echo '[]'; fi; }
          {
            echo "plan_workloads=$(to_json "$added")"
            echo "destroy_workloads=$(to_json "$deleted")"
            [ -n "$added" ]   && echo "any_plan=true"    || echo "any_plan=false"
            [ -n "$deleted" ] && echo "any_destroy=true" || echo "any_destroy=false"
          } >> "$GITHUB_OUTPUT"
          echo "plan: [$added]  destroy: [$deleted]"

  # 2) Create/update preview for added or changed workloads.
  plan:
    needs: detect
    if: >
      needs.detect.outputs.any_plan == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workload: ${{ fromJSON(needs.detect.outputs.plan_workloads) }}
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.VENDING_PR_CLIENT_ID }} # read-only identity (repo variable)
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_state_storage_account_name: ${{ vars.STATE_STORAGE_ACCOUNT_NAME }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC, read-only PR identity)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.VENDING_PR_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8" # pin for reproducible previews (matches apply/destroy)

      - name: Terraform init (this workload's state key)
        run: >
          terraform -chdir=vending init -input=false
          -backend-config="resource_group_name=rg-alz-management-swc"
          -backend-config="storage_account_name=${{ vars.STATE_STORAGE_ACCOUNT_NAME }}"
          -backend-config="container_name=tfstate"
          -backend-config="key=${{ matrix.workload }}-vending.tfstate"

      - name: Terraform plan (read-only, no lock)
        id: plan
        run: |
          set +e
          terraform -chdir=vending plan -input=false -lock=false -no-color \
            -var="workload_name=${{ matrix.workload }}" \
            -var-file="workloads/${{ matrix.workload }}.tfvars" | tee plan.txt
          echo "exitcode=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Post preview to the PR
        if: always()
        uses: actions/github-script@v7
        env:
          WORKLOAD: ${{ matrix.workload }}
          MODE: plan
        with:
          script: |
            const fs = require('fs');
            const { WORKLOAD, MODE } = process.env;
            let out = fs.readFileSync('plan.txt', 'utf8');
            const max = 60000;
            if (out.length > max) out = out.slice(0, max) + '\n... (truncated) ...';
            const marker = `<!-- vending-pr-plan:${MODE}:${WORKLOAD} -->`;
            const body = `${marker}\n### Vending ${MODE} — \`${WORKLOAD}\`\n\n<details><summary>terraform ${MODE}</summary>\n\n\`\`\`\n${out}\n\`\`\`\n\n</details>`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Fail if plan errored
        if: steps.plan.outputs.exitcode != '0'
        run: |
          echo "::error::terraform plan failed for ${{ matrix.workload }}"
          exit 1

  # 3) Offboard preview for deleted workloads (checkout base, where the intake file still exists).
  plan_destroy:
    needs: detect
    if: >
      needs.detect.outputs.any_destroy == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workload: ${{ fromJSON(needs.detect.outputs.destroy_workloads) }}
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.VENDING_PR_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_state_storage_account_name: ${{ vars.STATE_STORAGE_ACCOUNT_NAME }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }} # base still has the deleted intake file

      - name: Azure login (OIDC, read-only PR identity)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.VENDING_PR_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8" # pin for reproducible previews (matches apply/destroy)

      - name: Terraform init (this workload's state key)
        run: >
          terraform -chdir=vending init -input=false
          -backend-config="resource_group_name=rg-alz-management-swc"
          -backend-config="storage_account_name=${{ vars.STATE_STORAGE_ACCOUNT_NAME }}"
          -backend-config="container_name=tfstate"
          -backend-config="key=${{ matrix.workload }}-vending.tfstate"

      - name: Terraform plan -destroy (read-only, no lock)
        id: plan
        run: |
          set +e
          terraform -chdir=vending plan -destroy -input=false -lock=false -no-color \
            -var="workload_name=${{ matrix.workload }}" \
            -var-file="workloads/${{ matrix.workload }}.tfvars" | tee plan.txt
          echo "exitcode=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Collect owner + enriched RG inventory
        id: meta
        run: |
          f="vending/workloads/${{ matrix.workload }}.tfvars"
          owner=$(sed -n 's/^[[:space:]]*owner[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' "$f" | head -n1)
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          rg=$(sed -n 's/^[[:space:]]*resource_group_name[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' "$f" | head -n1)
          echo "rg=$rg" >> "$GITHUB_OUTPUT"
          # Live blast-radius: enriched view of what the RG actually contains (read-only PR identity has Reader).
          # Include per-resource status, location, owner/contact tags and creation time so a reviewer has the
          # context to reach out before approving. Fall back progressively if --expand isn't supported.
          if az group show -n "$rg" -o none 2>/dev/null; then
            az resource list -g "$rg" \
              --query "sort_by([].{name:name, type:type, location:location, status:provisioningState, owner:tags.owner, contact:tags.contact, created:createdTime}, &type)" \
              -o json > rg_inventory.json 2>/dev/null \
              || az resource list -g "$rg" -o json > rg_inventory.json 2>/dev/null \
              || echo '[]' > rg_inventory.json
          else
            echo '[]' > rg_inventory.json
          fi

      - name: Post offboard preview to the PR
        if: always()
        uses: actions/github-script@v7
        env:
          WORKLOAD: ${{ matrix.workload }}
          MODE: destroy
          OWNER: ${{ steps.meta.outputs.owner }}
          RG: ${{ steps.meta.outputs.rg }}
        with:
          script: |
            const fs = require('fs');
            const { WORKLOAD, MODE, OWNER, RG } = process.env;
            let out = fs.readFileSync('plan.txt', 'utf8');
            const max = 60000;
            if (out.length > max) out = out.slice(0, max) + '\n... (truncated) ...';
            let rows = [];
            try { rows = JSON.parse(fs.readFileSync('rg_inventory.json', 'utf8')); } catch (e) { rows = []; }
            if (!Array.isArray(rows)) rows = [];
            const count = rows.length;
            const esc = (s) => String(s == null ? '' : s).replace(/\|/g, '\\|');
            let invTable;
            if (count === 0) {
              invTable = '_The resource group is empty of workload resources._';
            } else {
              const header = '| Name | Type | Location | Status | Owner tag | Contact tag | Created |\n|---|---|---|---|---|---|---|';
              const bodyRows = rows.map(r => `| ${esc(r.name)} | ${esc(r.type)} | ${esc(r.location)} | ${esc(r.status)} | ${esc(r.owner)} | ${esc(r.contact)} | ${esc(r.created)} |`).join('\n');
              invTable = `${header}\n${bodyRows}`;
            }
            const marker = `<!-- vending-pr-plan:${MODE}:${WORKLOAD} -->`;
            const ownerLine = OWNER ? `\n> **Owner:** ${OWNER} — reach out before offboarding.` : '';
            const banner = `> ⚠️ **Merging offboards this workload** — a fresh \`terraform destroy\` is re-planned and applied on merge.${ownerLine}`;
            const blast = (count > 0)
              ? `> 💥 **Blast radius:** the resource group \`${RG}\` still contains **${count}** resource(s) — deleting the RG deletes these too. The destroy workflow will **refuse** unless forced.`
              : `> ✅ **Blast radius:** the resource group \`${RG}\` is empty of workload resources.`;
            const body = `${marker}\n### Vending ${MODE} (offboard) — \`${WORKLOAD}\`\n\n${banner}\n\n${blast}\n\n**Resource group contents (\`${RG}\`)**\n\n${invTable}\n\n<details><summary>terraform plan -destroy</summary>\n\n\`\`\`\n${out}\n\`\`\`\n\n</details>`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Fail if destroy plan errored
        if: steps.plan.outputs.exitcode != '0'
        run: |
          echo "::error::terraform plan -destroy failed for ${{ matrix.workload }}"
          exit 1
