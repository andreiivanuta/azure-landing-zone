# Vending pipeline: create or offboard a workload's landing-zone shell (RG + identities) from its intake file.
# Actions:
#   plan    = speculative preview only (no changes)
#   apply   = plan -> show in job summary -> apply the SAVED plan (creates/updates)
#   destroy = plan -destroy -> show in job summary -> apply the SAVED plan (offboards)
# One workload = one state file (key=<workload>.tfstate). apply/destroy always show the plan first (plan-as-gate).
# NOTE: pin actions to commit SHAs, and add a required reviewer on the `vending` environment, before production.
name: Vend workload identities

on:
  workflow_dispatch:
    inputs:
      workload:
        description: "Workload name (matches vending/workloads/<name>.tfvars)"
        required: true
        type: string
      action:
        description: "plan = preview | apply = create/update | destroy = offboard (remove RG + identities)"
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
          - destroy
      confirm:
        description: "To DESTROY, type the workload name here to confirm. Ignored for plan/apply."
        required: false
        type: string

permissions:
  id-token: write # OIDC login to Azure (provider + backend)
  contents: read # checkout the repo

jobs:
  vend:
    runs-on: ubuntu-latest
    environment: vending # subject :environment:vending; bounded identity, dev+main branch policy
    env:
      # Terraform (provider + backend) authenticates via GitHub OIDC - no secret.
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      # Required Terraform input: the Bicep-provisioned state storage account name (repo variable, non-secret).
      # Terraform maps TF_VAR_<name> onto the `state_storage_account_name` variable the state data source reads.
      TF_VAR_state_storage_account_name: ${{ vars.STATE_STORAGE_ACCOUNT_NAME }}
    steps:
      - name: Guard - confirm destroy
        if: inputs.action == 'destroy'
        run: |
          if [ "${{ inputs.confirm }}" != "${{ inputs.workload }}" ]; then
            echo "::error::To destroy, set 'confirm' to the workload name ('${{ inputs.workload }}')."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init (this workload's own state)
        run: >
          terraform -chdir=vending init -input=false
          -backend-config="resource_group_name=rg-alz-management-swc"
          -backend-config="storage_account_name=${{ vars.STATE_STORAGE_ACCOUNT_NAME }}"
          -backend-config="container_name=tfstate"
          -backend-config="key=${{ inputs.workload }}.tfstate"

      - name: Terraform plan (preview only)
        if: inputs.action == 'plan'
        run: |
          terraform -chdir=vending plan -input=false -out=tf.plan \
            -var="workload_name=${{ inputs.workload }}" \
            -var-file="workloads/${{ inputs.workload }}.tfvars"
          {
            echo "### Terraform plan (preview) - \`${{ inputs.workload }}\`"
            echo '```terraform'
            terraform -chdir=vending show -no-color tf.plan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform plan (for apply)
        if: inputs.action == 'apply'
        run: |
          terraform -chdir=vending plan -input=false -out=tf.plan \
            -var="workload_name=${{ inputs.workload }}" \
            -var-file="workloads/${{ inputs.workload }}.tfvars"
          {
            echo "### Terraform plan (apply) - \`${{ inputs.workload }}\`"
            echo '```terraform'
            terraform -chdir=vending show -no-color tf.plan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform apply (saved plan)
        if: inputs.action == 'apply'
        run: terraform -chdir=vending apply -input=false tf.plan

      - name: Terraform plan (for destroy)
        if: inputs.action == 'destroy'
        run: |
          terraform -chdir=vending plan -destroy -input=false -out=tf.plan \
            -var="workload_name=${{ inputs.workload }}" \
            -var-file="workloads/${{ inputs.workload }}.tfvars"
          {
            echo "### Terraform plan (DESTROY) - \`${{ inputs.workload }}\`"
            echo '```terraform'
            terraform -chdir=vending show -no-color tf.plan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform destroy (saved plan)
        if: inputs.action == 'destroy'
        run: terraform -chdir=vending apply -input=false tf.plan
