# Diagnostic: proves GitHub Actions can (1) authenticate to Azure via OIDC (no stored secret)
# as the admin identity, and (2) reach the Terraform state backend. Run manually.
# NOTE: pin actions to commit SHAs before treating any workflow as production.
name: OIDC + backend smoke test

on:
  workflow_dispatch: {}

permissions:
  id-token: write # required to mint the GitHub OIDC token
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    environment: admin # subject becomes :environment:admin; enforces the dev-only branch policy
    env:
      # Terraform's azurerm backend authenticates via GitHub OIDC - same identity, no secret.
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC, no secret)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Prove we're authenticated
        run: az account show --output table

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init (reach the state backend)
        run: >
          terraform -chdir=vending init -input=false
          -backend-config="resource_group_name=rg-alz-management-swc"
          -backend-config="storage_account_name=${{ vars.STATE_STORAGE_ACCOUNT_NAME }}"
          -backend-config="container_name=tfstate"
          -backend-config="key=connectivity-check.tfstate"
