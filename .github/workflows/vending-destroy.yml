# Automated OFFBOARD flow. On merge that DELETES a workload intake file, DOWNLOAD the exact destroy plan that
# was reviewed on the PR (uploaded by vending-pr-plan.yml) and apply it - so the offboard is byte-for-byte what
# was approved. `terraform apply <planfile>` refuses a stale plan and fails safe if state moved. Not recomputed.
# The deleted file no longer exists on main HEAD, so the apply job checks out github.event.before (main just
# before this merge), where vending/workloads/<name>.tfvars still exists, to load the config.
#   detect job  : which workloads were deleted + find the PR-plan run that produced the reviewed destroy plan.
#   destroy job : download that plan, log in as the vending write identity, `terraform apply tf.plan`,
#                then un-seed the workload repo (remove the environments created on onboard) with a repo-scoped GitHub App token.
# NOTE: pin actions to commit SHAs before treating any workflow as production.
name: Vending destroy (offboard)

on:
  push:
    branches: [main]
    paths:
      - "vending/workloads/**"

permissions:
  id-token: write # OIDC login to Azure
  contents: read # checkout
  actions: read # download the artifact from the PR-plan run
  pull-requests: read # correlate the merge commit to its PR

concurrency:
  group: vending-destroy # serialize successive offboard runs; apply has its own group
  cancel-in-progress: false

jobs:
  # 1) Which workloads were deleted, and which PR-plan run holds their reviewed destroy plan?
  detect:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      workloads: ${{ steps.diff.outputs.workloads }}
      any: ${{ steps.diff.outputs.any }}
      base: ${{ steps.diff.outputs.base }}
      pr_head_sha: ${{ steps.correlate.outputs.pr_head_sha }}
      plan_run_id: ${{ steps.correlate.outputs.plan_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: diff
        name: Detect deleted workloads
        run: |
          base='${{ github.event.before }}'
          head='${{ github.sha }}'
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            base=$(git rev-parse "$head^" 2>/dev/null || echo "$head")
          fi
          deleted=$(git diff --name-only --diff-filter=D "$base" "$head" -- 'vending/workloads/*.tfvars' \
            | grep -v '\.example$' | sed -n 's#.*/\([^/]*\)\.tfvars#\1#p' | sort -u)
          if [ -n "$deleted" ]; then
            json=$(printf '%s\n' "$deleted" | jq -R . | jq -cs .)
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            json='[]'; echo "any=false" >> "$GITHUB_OUTPUT"
          fi
          echo "workloads=$json" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "deleted: [$deleted]  base=$base"

      - id: correlate
        name: Find the PR-plan run that produced the reviewed destroy plan
        run: |
          merge_sha='${{ github.sha }}'
          pr_head=$(gh api "repos/${{ github.repository }}/commits/$merge_sha/pulls" \
            -H "Accept: application/vnd.github+json" --jq '.[0].head.sha // empty')
          run_id=""
          if [ -n "$pr_head" ]; then
            run_id=$(gh api "repos/${{ github.repository }}/actions/workflows/vending-pr-plan.yml/runs?head_sha=$pr_head&event=pull_request" \
              --jq '[.workflow_runs[] | select(.conclusion=="success")] | .[0].id // empty')
          fi
          echo "pr_head_sha=$pr_head" >> "$GITHUB_OUTPUT"
          echo "plan_run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "pr_head=$pr_head  plan_run_id=$run_id"

  # 2) Apply the EXACT reviewed destroy plan, one workload per matrix leg.
  destroy:
    needs: detect
    if: needs.detect.outputs.any == 'true'
    runs-on: ubuntu-latest
    environment: vending # supplies the vending write identity's OIDC subject :environment:vending on main
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        workload: ${{ fromJSON(needs.detect.outputs.workloads) }}
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }} # vending (write) identity from the environment
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_state_storage_account_name: ${{ vars.STATE_STORAGE_ACCOUNT_NAME }}
    steps:
      - name: Ensure a reviewed plan exists
        run: |
          if [ -z "${{ needs.detect.outputs.plan_run_id }}" ]; then
            echo "::error::No successful vending-pr-plan run found for this merge. Offboards must go through a PR so the reviewed destroy plan can be applied."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.detect.outputs.base }} # pre-merge commit still has the deleted intake file (needed to load config)

      - name: Download the reviewed destroy plan (from the PR-plan run)
        uses: actions/download-artifact@v4
        with:
          name: tfplan-destroy-${{ matrix.workload }}-${{ needs.detect.outputs.pr_head_sha }}
          path: vending
          run-id: ${{ needs.detect.outputs.plan_run_id }}
          github-token: ${{ github.token }}

      - name: Azure login (OIDC, vending write identity)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8" # pin so the merge-time destroy matches the PR-time plan (saved plans need the exact version)

      - name: Terraform init (this workload's state key)
        run: >
          terraform -chdir=vending init -input=false
          -backend-config="resource_group_name=rg-alz-management-swc"
          -backend-config="storage_account_name=${{ vars.STATE_STORAGE_ACCOUNT_NAME }}"
          -backend-config="container_name=tfstate"
          -backend-config="key=${{ matrix.workload }}.tfstate"

      - name: Capture seed coordinates before destroy
        id: tf
        run: |
          slug=$(terraform -chdir=vending output -raw workload_repo_slug 2>/dev/null || echo "")
          echo "slug=$slug"        >> "$GITHUB_OUTPUT"
          echo "owner=${slug%%/*}" >> "$GITHUB_OUTPUT"
          echo "repo=${slug##*/}"  >> "$GITHUB_OUTPUT"
          terraform -chdir=vending output -json environment_client_ids > env_client_ids.json 2>/dev/null || echo '{}' > env_client_ids.json
          echo "workload repo: ${slug:-<none>}"

      - name: Terraform apply (the exact reviewed destroy plan)
        run: terraform -chdir=vending apply -input=false tf.plan

      # --- Un-seed the workload repo: remove the environments created on onboard (identities are now gone) ---
      - name: Mint a repo-scoped token for the workload repo
        id: apptoken
        if: steps.tf.outputs.slug != ''
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.VENDING_APP_ID }}
          private-key: ${{ secrets.VENDING_APP_PRIVATE_KEY }}
          owner: ${{ steps.tf.outputs.owner }}
          repositories: ${{ steps.tf.outputs.repo }}

      - name: Un-seed the workload repo (remove environments)
        if: steps.tf.outputs.slug != ''
        env:
          GH_TOKEN: ${{ steps.apptoken.outputs.token }}
          SLUG: ${{ steps.tf.outputs.slug }}
        run: |
          set -euo pipefail
          jq -r 'keys[]' env_client_ids.json | while IFS= read -r env; do
            gh api --method DELETE "repos/$SLUG/environments/$env" --silent || echo "environment '$env' already absent"
            echo "removed $SLUG :: environment '$env'"
          done
