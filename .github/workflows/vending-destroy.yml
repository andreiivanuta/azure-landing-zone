# Automated OFFBOARD flow (convergent). On merge that DELETES a workload intake file, RE-PLAN the destroy
# against current state and apply it. The deleted file no longer exists on main HEAD, so we check out the
# pre-merge commit (github.event.before), where vending/workloads/<name>.tfvars still exists, to load config.
#
# Because it re-plans, this is safely RE-RUNNABLE and can be triggered manually (workflow_dispatch) to tear
# down a workload or recover a failed offboard without crafting a new PR. After destroy, it un-seeds the
# workload repo (removes the login values it had seeded) via a repo-scoped GitHub App token.
#   detect job  : which workloads to destroy (push deletions, or the workflow_dispatch input) + the ref to load config from.
#   destroy job : capture seed coords, `terraform destroy` (fresh), then un-seed the repo.
# NOTE: pin actions to commit SHAs before treating any workflow as production.
name: Vending destroy (offboard)

on:
  push:
    branches: [main]
    paths:
      - "vending/workloads/**"
  workflow_dispatch:
    inputs:
      workload:
        description: "Workload to destroy + un-seed."
        required: true
      ref:
        description: "Git ref/SHA that still contains the workload's intake file (defaults to the current branch)."
        required: false
        default: ""
      force:
        description: "Override the blast-radius gate (type true to destroy even if the resource group still holds resources)."
        required: false
        default: "false"

permissions:
  id-token: write # OIDC login to Azure
  contents: read # checkout

concurrency:
  group: vending-destroy # serialize successive offboard runs; apply has its own group
  cancel-in-progress: false

jobs:
  # 1) Which workloads were deleted (push) or named (dispatch), and which ref still holds their config?
  detect:
    runs-on: ubuntu-latest
    outputs:
      workloads: ${{ steps.pick.outputs.workloads }}
      any: ${{ steps.pick.outputs.any }}
      ref: ${{ steps.pick.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: pick
        name: Select workloads + config ref
        env:
          EVENT: ${{ github.event_name }}
          INPUT: ${{ github.event.inputs.workload }}
          INPUT_REF: ${{ github.event.inputs.ref }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            names="$INPUT"
            ref="${INPUT_REF:-${{ github.ref_name }}}"
          else
            base='${{ github.event.before }}'
            head='${{ github.sha }}'
            if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
              base=$(git rev-parse "$head^" 2>/dev/null || echo "$head")
            fi
            names=$(git diff --name-only --diff-filter=D "$base" "$head" -- 'vending/workloads/*.tfvars' \
              | grep -v '\.example$' | sed -n 's#.*/\([^/]*\)\.tfvars#\1#p' | sort -u)
            ref="$base"
          fi
          if [ -n "$names" ]; then
            json=$(printf '%s\n' "$names" | jq -R . | jq -cs .)
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            json='[]'; echo "any=false" >> "$GITHUB_OUTPUT"
          fi
          echo "workloads=$json" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "selected: [$names]  ref=$ref"

  # 2) Re-plan + destroy, one workload per matrix leg, then un-seed that workload's repo.
  destroy:
    needs: detect
    if: needs.detect.outputs.any == 'true'
    runs-on: ubuntu-latest
    environment: vending # supplies the vending write identity's OIDC subject :environment:vending on main
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        workload: ${{ fromJSON(needs.detect.outputs.workloads) }}
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }} # vending (write) identity from the environment
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_state_storage_account_name: ${{ vars.STATE_STORAGE_ACCOUNT_NAME }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.detect.outputs.ref }} # a ref where the deleted intake file still exists

      - name: Fail early if the intake file is missing
        run: |
          if [ ! -f "vending/workloads/${{ matrix.workload }}.tfvars" ]; then
            echo "::error::vending/workloads/${{ matrix.workload }}.tfvars not found on ref '${{ needs.detect.outputs.ref }}'. Pass a ref that still contains it."
            exit 1
          fi

      - name: Azure login (OIDC, vending write identity)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Blast-radius pre-flight (refuse if the RG still holds resources)
        env:
          FORCE: ${{ github.event.inputs.force }}
        run: |
          set -euo pipefail
          f="vending/workloads/${{ matrix.workload }}.tfvars"
          rg=$(sed -n 's/^[[:space:]]*resource_group_name[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' "$f" | head -n1)
          if [ -z "$rg" ]; then echo "::error::could not read resource_group_name from $f"; exit 1; fi
          if ! az group show -n "$rg" -o none 2>/dev/null; then
            echo "resource group '$rg' does not exist — nothing to protect, proceeding"
          else
            count=$(az resource list -g "$rg" --query "length(@)" -o tsv)
            echo "resource group '$rg' contains ${count:-0} resource(s)"
            if [ "${count:-0}" -gt 0 ] && [ "${FORCE:-false}" != "true" ]; then
              echo "::error::RG '$rg' still contains ${count} resource(s) — these belong to the workload and would be RECURSIVELY DELETED with the RG. Have the workload tear down its own infrastructure first, or re-run this workflow manually with force = true."
              az resource list -g "$rg" \
                --query "sort_by([].{name:name, type:type, location:location, status:provisioningState, owner:tags.owner, contact:tags.contact, created:createdTime}, &type)" \
                -o table || az resource list -g "$rg" -o table || true
              exit 1
            fi
          fi

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform init (this workload's state key)
        run: >
          terraform -chdir=vending init -input=false
          -backend-config="resource_group_name=rg-alz-management-swc"
          -backend-config="storage_account_name=${{ vars.STATE_STORAGE_ACCOUNT_NAME }}"
          -backend-config="container_name=tfstate"
          -backend-config="key=${{ matrix.workload }}-vending.tfstate"

      - name: Derive workload repo slug from the intake file
        id: tf
        run: |
          f="vending/workloads/${{ matrix.workload }}.tfvars"
          slug=$(sed -n 's/.*subject_prefix[[:space:]]*=[[:space:]]*"repo:\([^@]*\)@[0-9]*\/\([^@/]*\)@[0-9]*".*/\1\/\2/p' "$f" | head -n1)
          echo "slug=$slug"        >> "$GITHUB_OUTPUT"
          echo "owner=${slug%%/*}" >> "$GITHUB_OUTPUT"
          echo "repo=${slug##*/}"  >> "$GITHUB_OUTPUT"
          echo "workload repo: ${slug:-<none>}"

      - name: Terraform destroy (fresh plan against current state)
        run: |
          terraform -chdir=vending destroy -input=false -auto-approve \
            -var="workload_name=${{ matrix.workload }}" \
            -var-file="workloads/${{ matrix.workload }}.tfvars"

      # --- Un-seed the workload repo: remove the repo-level login values (identities are now gone) ---
      # Slug + variable names come from the intake file and a live listing (NOT Terraform state), so this
      # step is idempotent and re-runnable even though `terraform destroy` has already cleared the state.
      - name: Mint a repo-scoped token for the workload repo
        id: apptoken
        if: steps.tf.outputs.slug != ''
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.VENDING_APP_ID }}
          private-key: ${{ secrets.VENDING_APP_PRIVATE_KEY }}
          owner: ${{ steps.tf.outputs.owner }}
          repositories: ${{ steps.tf.outputs.repo }}

      - name: Un-seed the workload repo (remove login values)
        if: steps.tf.outputs.slug != ''
        env:
          GH_TOKEN: ${{ steps.apptoken.outputs.token }}
          SLUG: ${{ steps.tf.outputs.slug }}
        run: |
          set -euo pipefail
          # Delete every per-environment client-id variable actually present (no dependence on TF state).
          gh variable list --repo "$SLUG" | awk '{print $1}' | grep '^AZURE_CLIENT_ID_' | while IFS= read -r v; do
            gh variable delete "$v" --repo "$SLUG" 2>/dev/null || echo "$v already absent"
          done
          gh variable delete AZURE_TENANT_ID            --repo "$SLUG" 2>/dev/null || echo "AZURE_TENANT_ID already absent"
          gh variable delete STATE_STORAGE_ACCOUNT_NAME --repo "$SLUG" 2>/dev/null || echo "STATE_STORAGE_ACCOUNT_NAME already absent"
          gh secret   delete AZURE_SUBSCRIPTION_ID      --repo "$SLUG" 2>/dev/null || echo "AZURE_SUBSCRIPTION_ID already absent"
          echo "un-seeded $SLUG"
