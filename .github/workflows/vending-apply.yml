# Automated CREATE/UPDATE flow (convergent). On merge to main, RE-PLAN the changed workloads against
# current state and apply. The PR posted a human-readable plan preview for review (the gate); here we
# compute a fresh plan and apply it, so a re-run is always safe: `terraform apply` is a no-op when
# nothing changed, and Terraform's own state locking/serial checks keep it correct.
#
# Because it re-plans, this workflow is safely RE-RUNNABLE and can be triggered manually
# (workflow_dispatch) to recover from a transient failure (e.g. a hiccup in the seeding step) without
# opening a new PR. After apply, it seeds the workload repo's login values (repo-level variables) via a
# repo-scoped GitHub App token.
#   detect job : which workloads to apply (push diff, or the workflow_dispatch input).
#   apply job  : log in as the vending write identity, `terraform apply` (fresh), then seed the repo.
# NOTE: pin actions to commit SHAs before treating any workflow as production.
name: Vending apply (create/update)

on:
  push:
    branches: [main]
    paths:
      - "vending/workloads/**"
  workflow_dispatch:
    inputs:
      workload:
        description: "Workload to apply + seed. Leave empty to reconcile ALL current workloads."
        required: false
        default: ""

permissions:
  id-token: write # OIDC login to Azure
  contents: read # checkout

concurrency:
  group: vending-apply # serialize successive create/update runs; destroy has its own group
  cancel-in-progress: false

jobs:
  # 1) Which workloads should we apply? On push: the added/changed intake files. On manual dispatch:
  #    the named workload, or ALL current workloads when the input is left empty (idempotent reconcile).
  detect:
    runs-on: ubuntu-latest
    outputs:
      workloads: ${{ steps.pick.outputs.workloads }}
      any: ${{ steps.pick.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: pick
        name: Select workloads
        env:
          EVENT: ${{ github.event_name }}
          INPUT: ${{ github.event.inputs.workload }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ -n "$INPUT" ]; then
              names="$INPUT"
            else
              # Reconcile everything currently declared.
              names=$(ls vending/workloads/*.tfvars 2>/dev/null | grep -v '\.example$' \
                | sed -n 's#.*/\([^/]*\)\.tfvars#\1#p' | sort -u)
            fi
          else
            base='${{ github.event.before }}'
            head='${{ github.sha }}'
            if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
              base=$(git rev-parse "$head^" 2>/dev/null || echo "$head")
            fi
            names=$(git diff --name-only --diff-filter=ACMR "$base" "$head" -- 'vending/workloads/*.tfvars' \
              | grep -v '\.example$' | sed -n 's#.*/\([^/]*\)\.tfvars#\1#p' | sort -u)
          fi
          if [ -n "$names" ]; then
            json=$(printf '%s\n' "$names" | jq -R . | jq -cs .)
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            json='[]'; echo "any=false" >> "$GITHUB_OUTPUT"
          fi
          echo "workloads=$json" >> "$GITHUB_OUTPUT"
          echo "selected: [$names]"

  # 2) Re-plan + apply, one workload per matrix leg, then seed that workload's repo.
  apply:
    needs: detect
    if: needs.detect.outputs.any == 'true'
    runs-on: ubuntu-latest
    environment: vending # supplies the vending write identity's OIDC subject :environment:vending on main
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        workload: ${{ fromJSON(needs.detect.outputs.workloads) }}
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }} # vending (write) identity from the environment
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_state_storage_account_name: ${{ vars.STATE_STORAGE_ACCOUNT_NAME }}
    steps:
      - uses: actions/checkout@v4

      - name: Fail early if the intake file is missing
        run: |
          if [ ! -f "vending/workloads/${{ matrix.workload }}.tfvars" ]; then
            echo "::error::vending/workloads/${{ matrix.workload }}.tfvars not found on this ref."
            exit 1
          fi

      - name: Azure login (OIDC, vending write identity)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform init (this workload's state key)
        run: >
          terraform -chdir=vending init -input=false
          -backend-config="resource_group_name=rg-alz-management-swc"
          -backend-config="storage_account_name=${{ vars.STATE_STORAGE_ACCOUNT_NAME }}"
          -backend-config="container_name=tfstate"
          -backend-config="key=${{ matrix.workload }}.tfstate"

      - name: Terraform apply (fresh plan against current state)
        run: |
          terraform -chdir=vending apply -input=false -auto-approve \
            -var="workload_name=${{ matrix.workload }}" \
            -var-file="workloads/${{ matrix.workload }}.tfvars"

      # --- Seed the workload repo automatically with its login values (repo-level variables) ---
      # Uses a GitHub App installation token scoped to JUST this workload's repo (owner-granted, short-lived).
      # Repo-level variables only: the App needs just Variables/Secrets (not Administration). The workload's
      # own job selects its identity by referencing a job `environment:` (GitHub auto-creates it) and reading
      # AZURE_CLIENT_ID_<ENV>. Client IDs are not secrets; the real gate is the OIDC subject :environment:<env>.
      - name: Read vended outputs (repo slug + per-environment client IDs)
        id: tf
        run: |
          slug=$(terraform -chdir=vending output -raw workload_repo_slug)
          echo "slug=$slug"        >> "$GITHUB_OUTPUT"
          echo "owner=${slug%%/*}" >> "$GITHUB_OUTPUT"
          echo "repo=${slug##*/}"  >> "$GITHUB_OUTPUT"
          terraform -chdir=vending output -json environment_client_ids > env_client_ids.json
          echo "workload repo: $slug"

      - name: Mint a repo-scoped token for the workload repo
        id: apptoken
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.VENDING_APP_ID }}
          private-key: ${{ secrets.VENDING_APP_PRIVATE_KEY }}
          owner: ${{ steps.tf.outputs.owner }}
          repositories: ${{ steps.tf.outputs.repo }}

      - name: Seed the workload repo (repo-level login values)
        env:
          GH_TOKEN: ${{ steps.apptoken.outputs.token }}
          SLUG: ${{ steps.tf.outputs.slug }}
          TENANT: ${{ vars.AZURE_TENANT_ID }}
          SUBSCRIPTION: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          STATE_SA: ${{ vars.STATE_STORAGE_ACCOUNT_NAME }}
        run: |
          set -euo pipefail
          # Shared values (same for every job)
          gh variable set STATE_STORAGE_ACCOUNT_NAME --repo "$SLUG" --body "$STATE_SA"
          gh variable set AZURE_TENANT_ID            --repo "$SLUG" --body "$TENANT"
          gh secret   set AZURE_SUBSCRIPTION_ID      --repo "$SLUG" --body "$SUBSCRIPTION"
          # One non-secret client ID per environment as AZURE_CLIENT_ID_<ENV>.
          # A workload job with `environment: apply` uses ${{ vars.AZURE_CLIENT_ID_APPLY }}, etc.
          jq -r 'keys[]' env_client_ids.json | while IFS= read -r env; do
            clientid="$(jq -r --arg e "$env" '.[$e]' env_client_ids.json)"
            up="$(printf '%s' "$env" | tr '[:lower:]-' '[:upper:]_')"
            gh variable set "AZURE_CLIENT_ID_${up}" --repo "$SLUG" --body "$clientid"
            echo "seeded $SLUG :: AZURE_CLIENT_ID_${up}"
          done
