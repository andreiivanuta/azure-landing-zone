# Automated CREATE/UPDATE flow. On merge to main, DOWNLOAD the exact plan that was reviewed on the PR
# (uploaded as an artifact by vending-pr-plan.yml) and apply it. So what deploys is byte-for-byte what was
# approved. If the state moved since the plan was saved, `terraform apply <planfile>` refuses (stale plan) and
# fails safe - forcing a fresh PR/review. The plan is NOT recomputed here.
#   detect job : which workloads changed + find the PR-plan run that produced the reviewed plan.
#   apply job  : download that plan, log in as the vending write identity, and `terraform apply tf.plan`.
# NOTE: pin actions to commit SHAs before treating any workflow as production.
name: Vending apply (create/update)

on:
  push:
    branches: [main]
    paths:
      - "vending/workloads/**"

permissions:
  id-token: write # OIDC login to Azure
  contents: read # checkout
  actions: read # download the artifact from the PR-plan run
  pull-requests: read # correlate the merge commit to its PR

concurrency:
  group: vending-apply # serialize successive create/update runs; destroy has its own group
  cancel-in-progress: false

jobs:
  # 1) Which workloads were added/changed, and which PR-plan run holds their reviewed plan?
  detect:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      workloads: ${{ steps.diff.outputs.workloads }}
      any: ${{ steps.diff.outputs.any }}
      pr_head_sha: ${{ steps.correlate.outputs.pr_head_sha }}
      plan_run_id: ${{ steps.correlate.outputs.plan_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: diff
        name: Detect added/changed workloads
        run: |
          base='${{ github.event.before }}'
          head='${{ github.sha }}'
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            base=$(git rev-parse "$head^" 2>/dev/null || echo "$head")
          fi
          changed=$(git diff --name-only --diff-filter=ACMR "$base" "$head" -- 'vending/workloads/*.tfvars' \
            | grep -v '\.example$' | sed -n 's#.*/\([^/]*\)\.tfvars#\1#p' | sort -u)
          if [ -n "$changed" ]; then
            json=$(printf '%s\n' "$changed" | jq -R . | jq -cs .)
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            json='[]'; echo "any=false" >> "$GITHUB_OUTPUT"
          fi
          echo "workloads=$json" >> "$GITHUB_OUTPUT"
          echo "added/changed: [$changed]"

      - id: correlate
        name: Find the PR-plan run that produced the reviewed plan
        run: |
          merge_sha='${{ github.sha }}'
          # The merge commit is associated with its pull request; get that PR's head SHA (what PR-plan ran on).
          pr_head=$(gh api "repos/${{ github.repository }}/commits/$merge_sha/pulls" \
            -H "Accept: application/vnd.github+json" --jq '.[0].head.sha // empty')
          run_id=""
          if [ -n "$pr_head" ]; then
            run_id=$(gh api "repos/${{ github.repository }}/actions/workflows/vending-pr-plan.yml/runs?head_sha=$pr_head&event=pull_request" \
              --jq '[.workflow_runs[] | select(.conclusion=="success")] | .[0].id // empty')
          fi
          echo "pr_head_sha=$pr_head" >> "$GITHUB_OUTPUT"
          echo "plan_run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "pr_head=$pr_head  plan_run_id=$run_id"

  # 2) Apply the EXACT reviewed plan, one workload per matrix leg.
  apply:
    needs: detect
    if: needs.detect.outputs.any == 'true'
    runs-on: ubuntu-latest
    environment: vending # supplies the vending write identity's OIDC subject :environment:vending on main
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        workload: ${{ fromJSON(needs.detect.outputs.workloads) }}
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }} # vending (write) identity from the environment
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_state_storage_account_name: ${{ vars.STATE_STORAGE_ACCOUNT_NAME }}
    steps:
      - name: Ensure a reviewed plan exists
        run: |
          if [ -z "${{ needs.detect.outputs.plan_run_id }}" ]; then
            echo "::error::No successful vending-pr-plan run found for this merge. Workload changes must go through a PR so the reviewed plan can be applied."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Download the reviewed plan (from the PR-plan run)
        uses: actions/download-artifact@v4
        with:
          name: tfplan-apply-${{ matrix.workload }}-${{ needs.detect.outputs.pr_head_sha }}
          path: vending
          run-id: ${{ needs.detect.outputs.plan_run_id }}
          github-token: ${{ github.token }}

      - name: Azure login (OIDC, vending write identity)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8" # pin so the merge-time apply matches the PR-time plan (saved plans need the exact version)

      - name: Terraform init (this workload's state key)
        run: >
          terraform -chdir=vending init -input=false
          -backend-config="resource_group_name=rg-alz-management-swc"
          -backend-config="storage_account_name=${{ vars.STATE_STORAGE_ACCOUNT_NAME }}"
          -backend-config="container_name=tfstate"
          -backend-config="key=${{ matrix.workload }}.tfstate"

      - name: Terraform apply (the exact reviewed plan)
        run: terraform -chdir=vending apply -input=false tf.plan
