# Automated CREATE/UPDATE flow: when a merge to main adds or changes a workload intake file,
# plan it (read-only) then apply the EXACT saved plan - automatically (merge = deploy; the PR is the gate).
#   plan job    : read-only identity (OIDC :ref:refs/heads/main), no environment -> cannot change anything
#   apply job   : vending identity, environment `vending` -> supplies the write OIDC subject; applies tf.plan
# The gate is the pull request (branch protection + the plan preview posted on the PR). The `vending`
# environment carries no required reviewer, so apply runs on merge with no second approval to forget.
# NOTE: pin actions to commit SHAs before treating any workflow as production.
name: Vending apply (create/update)

on:
  push:
    branches: [main]
    paths:
      - "vending/workloads/**"

permissions:
  id-token: write # OIDC login to Azure
  contents: read # checkout

concurrency:
  group: vending-apply # serialize successive create/update runs; destroy has its own group
  cancel-in-progress: false

jobs:
  # 1) Which workload intake files were added or changed by this merge?
  detect:
    runs-on: ubuntu-latest
    outputs:
      workloads: ${{ steps.diff.outputs.workloads }}
      any: ${{ steps.diff.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: diff
        name: Detect added/changed workloads
        run: |
          base='${{ github.event.before }}'
          head='${{ github.sha }}'
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            base=$(git rev-parse "$head^" 2>/dev/null || echo "$head")
          fi
          changed=$(git diff --name-only --diff-filter=ACMR "$base" "$head" -- 'vending/workloads/*.tfvars' \
            | grep -v '\.example$' | sed -n 's#.*/\([^/]*\)\.tfvars#\1#p' | sort -u)
          if [ -n "$changed" ]; then
            json=$(printf '%s\n' "$changed" | jq -R . | jq -cs .)
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            json='[]'; echo "any=false" >> "$GITHUB_OUTPUT"
          fi
          echo "workloads=$json" >> "$GITHUB_OUTPUT"
          echo "added/changed: [$changed]"

  # 2) Read-only plan per workload; print it for the reviewer and save it for the apply job.
  plan:
    needs: detect
    if: needs.detect.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workload: ${{ fromJSON(needs.detect.outputs.workloads) }}
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.VENDING_PR_CLIENT_ID }} # read-only identity
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_state_storage_account_name: ${{ vars.STATE_STORAGE_ACCOUNT_NAME }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC, read-only identity)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.VENDING_PR_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform init (this workload's state key)
        run: >
          terraform -chdir=vending init -input=false
          -backend-config="resource_group_name=rg-alz-management-swc"
          -backend-config="storage_account_name=${{ vars.STATE_STORAGE_ACCOUNT_NAME }}"
          -backend-config="container_name=tfstate"
          -backend-config="key=${{ matrix.workload }}.tfstate"

      - name: Terraform plan (read-only, save to file)
        run: |
          terraform -chdir=vending plan -input=false -lock=false -out=tf.plan \
            -var="workload_name=${{ matrix.workload }}" \
            -var-file="workloads/${{ matrix.workload }}.tfvars"
          {
            echo "### Vending apply plan — \`${{ matrix.workload }}\` (applied automatically on merge)"
            echo '```'
            terraform -chdir=vending show -no-color tf.plan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload saved plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-apply-${{ matrix.workload }}
          path: vending/tf.plan
          retention-days: 1
          if-no-files-found: error

  # 3) Apply the exact saved plan. environment `vending` supplies the write OIDC subject (no required reviewer).
  apply:
    needs: [detect, plan]
    if: needs.detect.outputs.any == 'true'
    runs-on: ubuntu-latest
    environment: vending # supplies the vending write identity's OIDC subject :environment:vending on main
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        workload: ${{ fromJSON(needs.detect.outputs.workloads) }}
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }} # vending (write) identity from the environment
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_state_storage_account_name: ${{ vars.STATE_STORAGE_ACCOUNT_NAME }}
    steps:
      - uses: actions/checkout@v4

      - name: Download the saved plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-apply-${{ matrix.workload }}
          path: vending

      - name: Azure login (OIDC, vending identity)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform init (same state key)
        run: >
          terraform -chdir=vending init -input=false
          -backend-config="resource_group_name=rg-alz-management-swc"
          -backend-config="storage_account_name=${{ vars.STATE_STORAGE_ACCOUNT_NAME }}"
          -backend-config="container_name=tfstate"
          -backend-config="key=${{ matrix.workload }}.tfstate"

      - name: Terraform apply (exact saved plan)
        run: terraform -chdir=vending apply -input=false tf.plan
